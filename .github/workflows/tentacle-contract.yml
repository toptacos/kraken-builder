name: tentacle-contract
on:
  push:
    paths: ['examples/tentacles/**', '.github/workflows/tentacle-contract.yml']
  pull_request:
    paths: ['examples/tentacles/**']
jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pytest
      - name: Every tentacle has a name and handler
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path("examples/tentacles")
          # A directory is a tentacle when it carries a manifest. Two entries
          # under examples/tentacles are containers by design and must not be
          # treated as tentacles themselves: polyglot/ holds one tentacle per
          # language, and hello-world/ is the compile-c demo target. rglob
          # finds the tentacles inside a container, so nothing is skipped that
          # should be checked; hello-world simply has none, correctly.
          manifests = sorted(root.rglob("tentacle.yaml"))
          if not manifests:
              raise SystemExit("no tentacle.yaml found under examples/tentacles")
          missing = []
          for man in manifests:
              data = yaml.safe_load(man.read_text()) or {}
              d = man.parent
              if not data.get("name"):
                  missing.append(f"{man} missing name")
              binary = data.get("binary") or "handler.py"
              if not (d / binary).exists() and not list(d.glob("handler.*")):
                  missing.append(f"{d} missing handler {binary}")
          if missing:
              raise SystemExit("\n".join(missing))
          print(f"ok: {len(manifests)} manifests")
          PY
