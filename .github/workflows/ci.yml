name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    # Steps below use shell heredocs (cat > plan.yaml <<'YAML'), which
    # PowerShell cannot parse. Git Bash ships on the Windows runner image.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: pip install pytest pyyaml
      - name: Full test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Offline-first: nothing in the suite may reach the network.
          KRAKEN_OFFLINE: "1"
        # The whole directory, not a hand-maintained file list — an explicit
        # list silently stops covering new tests.
        run: python -m pytest tests -q
      - name: CLI init vanilla demo doctor
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m kraken init
          python -m kraken vanilla
          python -m kraken demo
          python -m kraken doctor
      - name: kraken up plans and never starts a daemon by default
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -e
          # A plan written by the test itself. The berth arm is a sibling
          # repository, so CI cannot assume it is installed here.
          cat > plan.yaml <<'YAML'
          services:
            api:
              image: nginx:alpine
              networks:
                - kraken
          networks:
            kraken:
              name: kraken
              driver: bridge
          YAML
          python -m kraken up --file plan.yaml | tee plan.json
          grep -q '"daemon": false' plan.json
          grep -q '"name": "kraken"' plan.json
      - name: kraken up refuses to start offline
        env:
          PYTHONPATH: ${{ github.workspace }}
          KRAKEN_OFFLINE: "1"
        run: |
          set -e
          cat > plan.yaml <<'YAML'
          services:
            api:
              image: nginx:alpine
              networks:
                - kraken
          networks:
            kraken:
              name: kraken
          YAML
          python -m kraken up --file plan.yaml --start | tee started.json
          grep -q '"code": "offline"' started.json
      - name: kraken up without a plan exits cleanly
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          export KRAKEN_HOME="$RUNNER_TEMP/kraken-empty"
          mkdir -p "$KRAKEN_HOME"
          # Must report no_plan and exit non-zero, not raise.
          python -m kraken up | tee out.json
          grep -q '"code": "no_plan"' out.json
          python -m pytest tests/test_up_verb.py -q

  # Documentation is a test surface here: every command block in
  # docs/articles/ is executed and its published output must match.
  # POSIX only -- the articles use shell constructs, and the tentacle
  # runtimes they invoke (php, ruby, perl, go) are not guaranteed on
  # Windows runners. The probe-and-skip in the articles is a runtime
  # courtesy, not a portability claim.
  articles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: pip install pytest pyyaml
      - name: Articles still tell the truth
        env:
          PYTHONPATH: ${{ github.workspace }}
          KRAKEN_OFFLINE: "1"
        run: python scripts/verify_articles.py --check
      - name: Site links and taxonomy hold
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/verify_site.py
          python -m pytest tests/test_site.py -q
