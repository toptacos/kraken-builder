name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pyyaml
      - name: Tentacle and core tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_notes_tunnel_llm.py tests/test_expose.py tests/test_scopes_ca.py tests/test_panel.py tests/test_scourge_grant.py tests/test_suckers.py tests/test_install_wrapper.py tests/test_license_upgrade.py tests/test_wx_sucker.py tests/test_browse_js.py tests/test_demo_first_json.py -q
      - name: CLI init vanilla demo doctor
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m kraken init
          python -m kraken vanilla
          python -m kraken demo
          python -m kraken doctor
