id: jev-apply
description: Apply a Jev path edit through board, then show repo status.
compose: true
steps:
  - id: apply
    tentacle: board
    action: apply
    payload:
      file: .kraken/workspace.json
      operations:
        - op: set
          path: last_review
          value: board
  - id: repo
    tentacle: board
    action: repo
    needs: [apply]
