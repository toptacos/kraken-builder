name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - shell: bash
        env: { KRAKEN_OFFLINE: "1" }
        run: |
          python3 tests/test_board.py -v
          python3 tests/e2e_scenarios.py -v
          python3 tests/test_suckers.py -v
          python3 tests/test_license_roles.py -v
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t kraken-board:ci .
      - run: docker run --rm -e KRAKEN_OFFLINE=1 kraken-board:ci
