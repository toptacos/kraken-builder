name: board
version: "0.1.0"
license: free
runtime: binary
binary: handler.sh
actions:
  - ping
  - init
  - status
  - snapshot
  - repo
  - project
  - layout
  - ai
  - apply
  - analyze
  - open
  - finish
  - clear
timeout_sec: 60
data_dir: data
needs_docker: false
platforms:
  linux-amd64: { tested: true, binary: handler.sh }
  linux-arm64: { tested: false, binary: handler.sh }
  darwin-amd64: { tested: false, binary: handler.sh }
  darwin-arm64: { tested: false, binary: handler.sh }
  windows-amd64: { tested: false, binary: handler.sh }
  windows-arm64: { tested: false, binary: handler.sh }
requires:
  protocol: 1
  core: ">=0.1.0"
description: Project terminal dashboard. Panels for AI, git, terminal, and project status from a root config file. Local Jev + Ollama/llama.cpp only.
homepage: https://kraken.topta.co
hooks:
  after_run:
    - tentacle: save-text
      action: convert
      optional: true
      priority: 20
      if: ok
      when: ["board"]
