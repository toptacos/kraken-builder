    <h1>Kraken account</h1>
    
<p>Portal client for the same CLI. Login via api.topta.co. This page does not run tentacles.</p>
<form id="login">
  <input name="email" type="email" required placeholder="you@example.com">
  <button type="submit">Plan login</button>
</form>
<pre id="out">kraken account login you@example.com
kraken grant scourge
kraken license set scourge KEY</pre>
<script>
document.getElementById("login").onsubmit = (e) => {
  e.preventDefault();
  const email = e.target.email.value;
  document.getElementById("out").textContent = JSON.stringify({
    method: "POST",
    url: "https://api.topta.co/api/kraken/session/login",
    json: {email, kind: "portal"},
    sent: false
  }, null, 2);
};
</script>
