networks:
  kraken-trading-network:
    driver: bridge
    name: kraken-trading-network

services:
  # Flask Trading Bot API
  kraken-trading-bot:
    build: .
    container_name: kraken-trading-bot-${TIMESTAMP:-default}
    ports:
      - "8080:8080"
    environment:
      - TEST_MODE=${TEST_MODE:-false}
      - STARTING_BALANCE=${STARTING_BALANCE:-100}
      - TRADE_AMOUNT=${TRADE_AMOUNT:-10}
      - WEB_UI=${WEB_UI:-false}
      - OVERRIDE_TIMEOUT=${OVERRIDE_TIMEOUT:-30}
      - TAKE_PROFIT_PERCENT=${TAKE_PROFIT_PERCENT:-5}
      - STOP_LOSS_PERCENT=${STOP_LOSS_PERCENT:-2}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - KRAKEN_API_KEY=${KRAKEN_API_KEY}
      - KRAKEN_API_SECRET=${KRAKEN_API_SECRET}
      - COINBASE_API_KEY_NAME=${COINBASE_API_KEY_NAME}
      - COINBASE_API_PRIVATE_KEY=${COINBASE_API_PRIVATE_KEY}
      - KUCOIN_API_KEY=${KUCOIN_API_KEY}
      - KUCOIN_API_SECRET=${KUCOIN_API_SECRET}
      - KUCOIN_API_PASSPHRASE=${KUCOIN_API_PASSPHRASE}
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kraken-trading-network

  # Laravel Backend API
  kraken-laravel-backend:
    build:
      context: ./laravel-backend
      dockerfile: Dockerfile
    container_name: kraken-laravel-backend-${TIMESTAMP:-default}
    ports:
      - "8000:8000"
    environment:
      - APP_NAME="Kraken Trading Bot"
      - APP_ENV=production
      - APP_KEY=${APP_KEY:-base64:your_app_key_here}
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/app/database/database.sqlite
      - FLASK_API_URL=http://kraken-trading-bot:8080
      - LOG_CHANNEL=stack
      - LOG_LEVEL=info
    volumes:
      - ./laravel-backend:/app
      - ./logs:/app/storage/logs
    restart: unless-stopped
    depends_on:
      - kraken-trading-bot
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - kraken-trading-network

  # Vue.js Frontend (served by Laravel)
  kraken-vue-frontend:
    build:
      context: ./laravel-backend
      dockerfile: Dockerfile
    container_name: kraken-vue-frontend-${TIMESTAMP:-default}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VUE_APP_API_URL=http://localhost:8000/api
    volumes:
      - ./laravel-backend:/app
    restart: unless-stopped
    depends_on:
      - kraken-laravel-backend
    networks:
      - kraken-trading-network

  # Overnight Trading System
  overnight-trader:
    build: .
    container_name: overnight-trading-bot-${TIMESTAMP:-default}
    ports:
      - "8081:8081"
    environment:
      - TEST_MODE=${TEST_MODE:-false}
      - STARTING_BALANCE=${STARTING_BALANCE:-1000}
      - DAILY_PROFIT_TARGET=${DAILY_PROFIT_TARGET:-50}
      - DAILY_LOSS_LIMIT=${DAILY_LOSS_LIMIT:--100}
      - TRADE_AMOUNT=${TRADE_AMOUNT:-25}
      - MAX_TRADES_PER_HOUR=${MAX_TRADES_PER_HOUR:-12}
      - MIN_ARB_PROFIT_PCT=${MIN_ARB_PROFIT_PCT:-0.5}
      - MAX_ARB_POSITIONS=${MAX_ARB_POSITIONS:-5}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - KRAKEN_API_KEY=${KRAKEN_API_KEY}
      - KRAKEN_API_SECRET=${KRAKEN_API_SECRET}
      - COINBASE_API_KEY_NAME=${COINBASE_API_KEY_NAME}
      - COINBASE_API_PRIVATE_KEY=${COINBASE_API_PRIVATE_KEY}
      - KUCOIN_API_KEY=${KUCOIN_API_KEY}
      - KUCOIN_API_SECRET=${KUCOIN_API_SECRET}
      - KUCOIN_API_PASSPHRASE=${KUCOIN_API_PASSPHRASE}
      - COINMARKETCAP_API_KEY=${COINMARKETCAP_API_KEY}
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
    command: python3 overnight_trader.py
    restart: unless-stopped
    depends_on:
      - kraken-trading-bot
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overnight/status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: trading-redis-${TIMESTAMP:-default}
    ports:
      - "6379:6379"
    volumes:
      - kraken-redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # PostgreSQL for data storage (optional)
  postgres:
    image: postgres:15-alpine
    container_name: trading-postgres-${TIMESTAMP:-default}
    environment:
      - POSTGRES_DB=trading_bot
      - POSTGRES_USER=trading_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-trading_password}
    ports:
      - "5432:5432"
    volumes:
      - kraken-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:stable-alpine
    container_name: trading-nginx-${TIMESTAMP:-default}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - kraken-trading-bot
      - overnight-trader
    restart: unless-stopped

volumes:
  kraken-redis-data:
  kraken-postgres-data: