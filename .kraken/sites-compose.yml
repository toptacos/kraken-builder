services:
  app:
    image: nginx:alpine
    container_name: kraken_site_app
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - /private/tmp/kb-remote:/usr/share/nginx/html:ro
    networks: [kraken_sites]
    labels:
      kraken.tentacle: sites
      kraken.uri: http://127.0.0.1:8080
networks:
  kraken_sites:
    name: kraken_sites
    internal: false
    labels:
      kraken.tentacle: sites
